name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 校验标签与包版本
        run: |
          package_version=$(node -e "process.stdout.write(require('./package.json').version)")
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: 类型检查与构建
        run: npm run check
      - name: 构建安装包
        id: pack
        run: |
          package_file="$(npm pack --silent --ignore-scripts)"
          echo "package_file=${package_file}" >> "${GITHUB_OUTPUT}"
      - name: 创建私有 Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: gh release create "${GITHUB_REF_NAME}" "${PACKAGE_FILE}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
